packages:
  - "apps/*"
  - "packages/*"

# Keep a flat node_modules layout (parity with the previous Yarn Classic setup).
# Avoids pnpm's default isolated/symlink store so transitive deps resolve as
# before and Docker stage-to-stage `COPY node_modules` stays safe.
# NOTE: pnpm 11 only reads auth/registry settings from .npmrc; every other
# setting (nodeLinker, peers, etc.) must live here.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# pnpm 11 defaults `verifyDepsBeforeRun` to `install`, which makes `pnpm exec`
# silently re-install (and prune) node_modules before running a command. In the
# Docker sourcer stages this mutated the node_modules copied from the installer
# stage and wedged the build. node_modules is always built explicitly via
# `pnpm install --frozen-lockfile`, so never auto-install.
verifyDepsBeforeRun: false

# Migrated from the former Yarn `resolutions` field.
# The previous resolutions were flat (no parent>child scoping), so they map
# directly to global pnpm `overrides`.
overrides:
  # GHSA-4c8g-83qw-93j6 and later URI host-confusion fixes: require 3.1.6+.
  "fast-uri": "^3.1.9"
  # GHSA-73wf-gq98-2v4g / CVE-2026-73088: uncaught crash via custom stats.
  "browserslist": "^4.28.7"
  # GHSA-w5vr-8v7q-w6rv / CVE-2026-45819: process.exit on invalid input.
  "baseline-browser-mapping": "^2.11.0"
  "source-map-js": "^1.2.2"
  "postcss-selector-parser": "^7.1.6"
  "flatted": "^3.4.2"
  "handlebars": "^4.7.9"
  "vite": "^7.3.7"
  "js-yaml": "^4.3.2"
  "tar": "^7.5.11"
  "rollup": "^4.59.0"
  # GHSA-g3hv-75wg-m249: globparts amplification DoS, fixed only in
  # minimatch 11.0.1. eslint and @eslint/* still declare minimatch 3.x and
  # typescript-eslint 10.x; they only use the Minimatch class and the named
  # minimatch(), which 11 keeps. eslint-plugin-react calls the module as a
  # function, which fails since minimatch 9 (no default export), in rules this
  # config leaves off. minimatch 11 needs brace-expansion 5.
  "minimatch": "^11.0.3"
  "brace-expansion": "^5.0.12"
  # Dependabot #3 (GHSA-qx2v-qp2m-jg93 / CVE-2026-41305): force next's bundled
  # postcss 8.4.31 up to a patched 8.5.x. Require 8.5.18 for the later path
  # disclosure fix shared by all consumers.
  "postcss": "^8.5.18"
  # GHSA-2v37-7h3g-55p8: keep all PostCSS consumers on patched nanoid 3.x.
  "postcss>nanoid": "^3.3.19"
  # GHSA-rgj7-g3m4-5g8c: Next.js still requests sharp ^0.35.3, so force the
  # patched 0.35.4+ line until Next.js raises its optional dependency range.
  "sharp": "^0.35.5"
  # Dependabot #6 (GHSA-g7r4-m6w7-qqqr): patched in esbuild 0.28.1. vite@7 and
  # tsup@8 still declare esbuild "^0.27.0", so this override forces 0.28.x past
  # their range (vite@8 already accepts ^0.28, confirming API compatibility).
  # Caret pins within 0.28.x to pick up future patches without a 0.29 jump.
  "esbuild": "^0.28.1"
  # GHSA-m5mm-p8h7-m29v / CVE-2026-115897: XSS via unescaped </script> at the
  # end of a serialized function body. Fixed in 7.1.3; copy-webpack-plugin
  # still requests an earlier 7.x.
  "serialize-javascript": "^7.1.3"

# pnpm 10+ blocks dependency lifecycle scripts by default. pnpm 11 reviews them
# via `allowBuilds` (the old `onlyBuiltDependencies` was removed). Every package
# that ships a build script must be listed or install fails with
# ERR_PNPM_IGNORED_BUILDS. The list below is a starting point; add packages as
# install warnings surface.
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@parcel/watcher": true
  sharp: true
  # msw ships an `msw-cli` postinstall used by the Vitest test suite.
  msw: true

# Versions installed before pnpm's minimum release age had passed for them.
minimumReleaseAgeExclude:
  - "@craftsamo/repo-kit@1.4.0"
