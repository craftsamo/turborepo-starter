# Read by Release Drafter's autolabeler, which labels a pull request when it
# is opened. The release notes and the version come from those labels, through
# .github/release-notes.json and scripts/release.

autolabeler:
  # Type labels follow the branch name, whose prefix is the commit type of the
  # change. Each branch gets at most one, and it picks the release notes
  # category. A file rule such as `*.md` would label most pull requests as
  # documentation, since they touch AGENTS.md or docs alongside the code.
  - label: "🌱feature"
    branch:
      - "/^feat[/-].+/"

  - label: "⚒️enhancement"
    branch:
      - "/^(enhance|improve|refactor|perf)[/-].+/"

  - label: "🐛bug"
    branch:
      - "/^fix[/-].+/"

  - label: "🐞hotfix"
    branch:
      - "/^hotfix[/-].+/"

  - label: "📝documentation"
    branch:
      - "/^docs[/-].+/"

  - label: "🔧maintenance"
    branch:
      - "/^(ci|build|chore|test|style|revert)[/-].+/"

  - label: "dependencies"
    branch:
      - "/^(deps|dependabot)[/-].+/"

  # Area labels follow the changed files, compared with the pull request's
  # base, so a layer of a stack gets the areas it changes itself. They do not
  # affect the release notes. A pattern starting with / is anchored to the
  # repository root, and one ending with / takes everything below it.
  - label: "🌐app: web"
    files:
      - "/apps/web/"

  - label: "📦package: constants"
    files:
      - "/packages/constants/"

  - label: "📦package: eslint"
    files:
      - "/packages/eslint/"

  - label: "📦package: playwright"
    files:
      - "/packages/playwright/"

  - label: "📦package: prettier"
    files:
      - "/packages/prettier/"

  - label: "📦package: tsconfig"
    files:
      - "/packages/tsconfig/"

  - label: "📦package: types"
    files:
      - "/packages/types/"

  - label: "📦package: ui"
    files:
      - "/packages/ui/"

  - label: "📦package: vitest"
    files:
      - "/packages/vitest/"

  - label: "🔄workflows"
    files:
      - "/.github/"

  - label: "🛠️scripts"
    files:
      - "/scripts/"
