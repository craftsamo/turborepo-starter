# name-template: Specifies the naming convention for the release version.
name-template: "v$RESOLVED_VERSION 🚀"

# tag-template: Specifies the tagging convention for the release version.
tag-template: "v$RESOLVED_VERSION"

# Categories run in order. A changelog category is exclusive, so a pull
# request with several labels lands under the first one that matches instead
# of under each of them. A changelog category contributes a patch increment
# unless it sets semver-increment.
categories:
  # A pull request with this label does not appear in the release notes.
  - type: pre-exclude
    when:
      label: "skip-changelog"

  - title: 🚀 New Features
    semver-increment: minor
    exclusive: true
    when:
      label: "🌱feature"
  - title: 🐛 Bug Fixes
    exclusive: true
    when:
      labels:
        - "🐛bug"
        - "🐞hotfix"
  - title: ⚒️ Enhancement
    exclusive: true
    when:
      label: "⚒️enhancement"
  - title: 📄 Documentation
    exclusive: true
    when:
      label: "📝documentation"
  # The one category without a condition receives every pull request the
  # categories above did not match, so nothing floats outside a heading.
  - title: 🧰 Other Changes

  # A version-resolver category only affects $RESOLVED_VERSION. The highest
  # increment among all matching categories wins.
  - type: version-resolver
    semver-increment: major
    when:
      label: "🌟major"
  # The fallback when no other category resolves a version.
  - type: version-resolver
    semver-increment: patch

# change-template: Defines the format for individual change log entries in the release notes.
# - `$TITLE`: Represents the title of the change.
# - `$AUTHOR`: Represents the author of the change.
# - `#$NUMBER`: Represents the pull request or issue number.
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

# You can add # and @ to disable mentions, and add ` to disable code blocks.
change-title-escapes: '\<*_&'

# Every change sits under a category heading, so the body needs no heading of
# its own.
template: |
  $CHANGES

# Labels follow the branch name only. A file rule such as `*.md` would label
# most pull requests as documentation, since they touch AGENTS.md or docs
# alongside the code.
autolabeler:
  # Automatically applies the "🌱feature" label based on branch naming patterns.
  - label: "🌱feature"
    branch:
      - "/^feat[/-].+/"

  # Automatically applies the "⚒️enhancement" label based on branch naming patterns.
  - label: "⚒️enhancement"
    branch:
      - "/^(enhance|improve|refactor)[/-].+/"

  # Automatically applies the "🐛bug" label based on branch naming patterns.
  - label: "🐛bug"
    branch:
      - "/^fix[/-].+/"

  # Automatically applies the "🐞hotfix" label based on branch naming patterns.
  - label: "🐞hotfix"
    branch:
      - "/^hotfix[/-].+/"

  # Automatically applies the "📝documentation" label based on branch naming patterns.
  - label: "📝documentation"
    branch:
      - "/^docs[/-].+/"
