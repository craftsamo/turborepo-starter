# Read by Release Drafter's autolabeler, which labels a pull request when it
# is opened. The release notes and the version come from those labels, through
# .github/release-notes.json and scripts/release.

# Labels follow the branch name only. A file rule such as `*.md` would label
# most pull requests as documentation, since they touch AGENTS.md or docs
# alongside the code.
autolabeler:
  # Automatically applies the "🌱feature" label based on branch naming patterns.
  - label: "🌱feature"
    branch:
      - "/^feat[/-].+/"

  # Automatically applies the "⚒️enhancement" label based on branch naming patterns.
  - label: "⚒️enhancement"
    branch:
      - "/^(enhance|improve|refactor)[/-].+/"

  # Automatically applies the "🐛bug" label based on branch naming patterns.
  - label: "🐛bug"
    branch:
      - "/^fix[/-].+/"

  # Automatically applies the "🐞hotfix" label based on branch naming patterns.
  - label: "🐞hotfix"
    branch:
      - "/^hotfix[/-].+/"

  # Automatically applies the "📝documentation" label based on branch naming patterns.
  - label: "📝documentation"
    branch:
      - "/^docs[/-].+/"
