name: Bug Report
description: Report an issue that should be fixed
type: bug
labels: ["🐛bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What you expected and what happened instead, with any error message or log.
      placeholder: |
        - Expected: the form saves and shows a confirmation
        - Actual: the page reloads and the input is empty
        - Error / logs: `TypeError: Cannot read properties of undefined` in the console
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Repro steps
      description: The shortest path that shows the symptom.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: suspected-cause
    attributes:
      label: Suspected cause
      description: >-
        Where you think it comes from, with a permalink to the code when you have one. Add a
        `### Confirmed cause` once verified.
      placeholder: |
        The handler reads `event.target.value` before the ref is set:
        https://github.com/owner/repo/blob/<sha>/apps/web/src/...#L10-L20
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: Attach screenshots or a recording related to the issue.
      placeholder: Paste images here or drag & drop (optional).
    validations:
      required: false

  - type: textarea
    id: share-link
    attributes:
      label: Share Link
      description: Share the AI agent session link.
      placeholder: Paste the share link here (optional).
    validations:
      required: false
