name: Task
description: One unit of work, implemented by one branch or one stack of pull requests
type: task
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: The single goal, in one or two lines. What problem it solves and why now.
      placeholder: |
        Let a signed-in user export their data as CSV, so support stops doing it by hand.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: >-
        What must hold when this is done. Provisional while decisions are open; confirmed once
        they are settled. Use a `###` heading per sub-part (API, data, UI) when there are several.
      placeholder: |
        - Export runs server-side and streams the file
        - Only the owner can download it

        ### API
        - `POST /api/export` starts a job, `GET /api/export/{id}` fetches the result

        ### UI
        - A button on the account page; the link appears when the job is done
    validations:
      required: true

  - type: textarea
    id: implementation-outline
    attributes:
      label: Implementation outline
      description: >-
        How the work splits into pull requests. Prose while the spec is a draft; a checklist of
        layers, bottom to top, once it is fixed. Tick a layer with its PR number when the PR opens.
      placeholder: |
        - [ ] Export job and storage
        - [ ] API routes
        - [ ] Account page button and download link
    validations:
      required: false

  - type: textarea
    id: open-decisions
    attributes:
      label: Open decisions
      description: >-
        What must be settled before implementation starts. Remove this section when nothing is
        open: its presence marks the spec as a draft.
      placeholder: |
        - Keep finished exports for how long?
        - CSV only, or also JSON?
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: The checks that prove it done, including the commands to run.
      placeholder: |
        - [ ] `nps test` passes with the new cases
        - [ ] An export of 10,000 rows downloads within 5 s in staging
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the research, decisions and issues this one rests on.
      placeholder: |
        - Parent research: #12 (comment)
        - Decided in #15
    validations:
      required: false
