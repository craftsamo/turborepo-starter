name: Tests

on:
  # Every push to main runs, so that each main commit gets a Required checks
  # verdict and the workflows that follow a successful run, such as Release
  # Drafter, see one. The changes job keeps the expensive jobs scoped: a push
  # that touches nothing they test finishes on the changes job alone.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels its running checks, which no longer
# match its head. Pushes to main wait instead, and only the newest waiting run
# is kept, so the latest main commit is always checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Let Corepack download the pinned pnpm without an interactive prompt in CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  # The same store path on the runner and in the Playwright container, so every
  # job shares one pnpm store cache.
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.force.outputs.scripts || steps.filter.outputs.scripts }}
      web: ${{ steps.force.outputs.web || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      # A stack runs this workflow for every pull request in it. The checks run
      # only on the lowest unmerged one, which merges next, and the top one,
      # which holds every change in the stack. A middle one runs them once the
      # pull requests below it merge and it is rebased onto the stack base.
      - name: Skip the checks in the middle of a stack
        id: stack
        if: >-
          github.event.pull_request.stack != null &&
          github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref &&
          github.event.pull_request.stack.position != github.event.pull_request.stack.size
        env:
          POSITION: ${{ github.event.pull_request.stack.position }}
          SIZE: ${{ github.event.pull_request.stack.size }}
        run: echo "::notice::Pull request $POSITION of $SIZE in a stack. The checks run on the lowest unmerged and the top pull requests."
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && steps.stack.outcome == 'skipped'
        with:
          # A file counts when it matches a pattern and no '!' pattern.
          predicate-quantifier: some-with-excludes
          filters: |
            # The repository scripts and every file their tests read.
            scripts:
              - '.github/labels.yml'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.github/release-drafter.yml'
              - '.github/release-notes.json'
              - '.github/workflows/tests.yml'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - 'package.json'
              - 'package-scripts.js'
              - 'README.md'
              - 'scripts/**'
            # The app, the packages it builds from, and the toolchain. Their
            # Markdown is documentation; drop the exclusion if a build reads it.
            web:
              - '.github/workflows/tests.yml'
              - 'apps/web/**'
              - 'package.json'
              - 'package-scripts.js'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '!**/*.md'
      - name: Run all checks for manual dispatch
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "scripts=true" >> "$GITHUB_OUTPUT"
          echo "web=true" >> "$GITHUB_OUTPUT"

  script-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      # The setup job runs only for app changes, so the scripts are
      # typechecked here too.
      - name: Typecheck repository scripts
        run: npx nps typecheck.scripts
      - name: Test repository scripts
        run: npx nps test.ci.scripts

  setup:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
      pnpm-store-dir: ${{ steps.pnpm-store.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # Keep package-manager caching off: it would probe pnpm (from the
          # packageManager field) before Corepack runs. Corepack is enabled
          # below and the pnpm store is cached manually.
          package-manager-cache: false
      - name: Find the Playwright image
        id: playwright-image
        run: echo "image=$(node scripts/vrt/main.mts image)" >> "$GITHUB_OUTPUT"
      - name: Enable Corepack
        run: corepack enable
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: TypeScript versions
        run: |
          pnpm exec tsc --version
          pnpm exec tsc6 --version
          node -e "console.log('Compiler API ' + require('typescript').version)"
      - name: Lint
        run: npx nps lint
      - name: Typecheck
        run: npx nps typecheck

  test:
    needs: [setup, changes]
    runs-on: ubuntu-latest
    if: needs.setup.result == 'success'
    strategy:
      matrix:
        include:
          - target: web
            run: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # Keep package-manager caching off: it would probe pnpm (from the
          # packageManager field) before Corepack runs. Corepack is enabled
          # below and the pnpm store is cached manually.
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ needs.setup.outputs.pnpm-store-dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Prepare
        if: matrix.run == 'true'
        run: npx nps prepare.ci.${{ matrix.target }}
      - name: Build
        if: matrix.run == 'true'
        run: npx nps build.ci.${{ matrix.target }}
      - name: Test
        if: matrix.run == 'true'
        run: npx nps test.ci.${{ matrix.target }}

  e2e:
    needs: [setup, changes]
    runs-on: ubuntu-latest
    if: needs.setup.result == 'success' && needs.changes.outputs.web == 'true'
    # Screenshots render alike only on the same fonts and browser build, so
    # this job, Update VRT baselines and `nps vrt.update` all run in the
    # Playwright image of the installed version, which ships the browsers.
    container:
      image: ${{ needs.setup.outputs.playwright-image }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ needs.setup.outputs.pnpm-store-dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Prepare
        run: npx nps prepare.ci.web
      - name: Test E2E
        id: e2e
        run: npx nps test.ci.web.e2e.all
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-artifacts
          path: |
            out/apps/web/playwright-report/
            out/apps/web/test-results/
          if-no-files-found: ignore
          # Videos and traces are large and count toward the shared artifact
          # storage; a failure is looked into within days.
          retention-days: 3
      # When screenshots no longer match, render the baselines again where CI
      # compares them, so `nps vrt.accept` can bring the changed ones in.
      - name: Render VRT baselines
        id: vrt
        if: failure() && steps.e2e.outcome == 'failure'
        working-directory: out/apps/web
        env:
          VRT_UPDATE: "1"
        run: pnpm exec playwright test e2e/vrt.spec.ts --update-snapshots=changed --reporter=line
      - name: Collect changed VRT baselines
        id: baselines
        if: failure() && steps.vrt.outcome == 'success'
        run: node scripts/vrt/main.mts collect out vrt-baselines
      - name: Upload VRT baselines
        if: failure() && steps.baselines.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines
          path: vrt-baselines/
          retention-days: 7

  required-checks:
    name: Required checks
    if: always()
    needs: [changes, script-tests, setup, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCRIPTS_CHANGED: ${{ needs.changes.outputs.scripts }}
          SCRIPT_TESTS_RESULT: ${{ needs.script-tests.result }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          SETUP_RESULT: ${{ needs.setup.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$SCRIPTS_CHANGED" == "true" && "$SCRIPT_TESTS_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$WEB_CHANGED" == "true" && ( "$SETUP_RESULT" != "success" || "$TEST_RESULT" != "success" || "$E2E_RESULT" != "success" ) ]]; then
            exit 1
          fi
