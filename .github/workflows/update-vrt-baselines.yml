name: Update VRT baselines

# Renders the visual-regression baselines in the same Playwright image the
# Tests workflow compares them in, and uploads the ones that differ from the
# branch as the vrt-baselines artifact. Bring them in with `nps vrt.accept` on
# that branch, review the images, and commit them. The Tests workflow uploads
# the same artifact when screenshots change; run this one to seed baselines,
# which VRT skips while none are committed, or to refresh them on demand.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  pnpm_config_store_dir: /tmp/pnpm-store

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Find the Playwright image
        id: playwright-image
        run: echo "image=$(node scripts/vrt/main.mts image)" >> "$GITHUB_OUTPUT"

  update-baselines:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.playwright-image }}
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Prepare
        run: npx nps prepare.ci.web
      - name: Build web
        run: npx nps build.ci.web
      - name: Render VRT baselines
        working-directory: out/apps/web
        env:
          VRT_UPDATE: "1"
        run: pnpm exec playwright test e2e/vrt.spec.ts --update-snapshots=changed
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baseline-artifacts
          path: |
            out/apps/web/playwright-report/
            out/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect changed VRT baselines
        id: baselines
        run: node scripts/vrt/main.mts collect out vrt-baselines
      - name: Upload VRT baselines
        if: steps.baselines.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vrt-baselines
          path: vrt-baselines/
          retention-days: 7
