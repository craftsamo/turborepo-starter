name: Sync Labels

on:
  workflow_dispatch:

permissions: {}

jobs:
  # repo-kit's labels-sync workflow makes the labels the ones
  # .github/labels.yml declares, pruning undeclared ones.
  sync-labels:
    permissions:
      contents: read
      issues: write
    uses: craftsamo/repo-kit/.github/workflows/labels-sync.yml@v1
