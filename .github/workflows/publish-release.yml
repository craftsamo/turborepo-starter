name: Publish Release

on:
  # Publish the draft release from the Actions tab: set the version on main to
  # the draft's with a commit, then publish the draft on that commit, so the
  # tag names a commit that carries its version. `nps release.publish` does
  # the same from a checkout.
  workflow_dispatch:
  # A release published on the Releases page instead tags the commit the
  # draft targeted, before any version bump. Set the version on main
  # afterwards, so main still names the latest release.
  release:
    types: [published]

permissions: {}

jobs:
  # repo-kit's release-publish workflow pushes the version bump with the
  # release deploy key, which `nps setup.github` creates and lets bypass the
  # protection of main, and fails without it.
  publish:
    permissions:
      contents: write
    uses: craftsamo/repo-kit/.github/workflows/release-publish.yml@v1
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
