name: Release Drafter

on:
  push:
    branches: [main]
  # Labels follow the branch name, which a later push does not change, so a
  # pull request is labeled only when it is opened or reopened. Any base
  # counts: a stack opens each upper pull request on the branch below it, and
  # links it to the stack only afterwards.
  pull_request:
    types: [opened, reopened]

jobs:
  update_release_draft:
    # Each run rebuilds the draft and the labels from the current state, so a
    # newer run replaces the one still in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          # A pull request run only labels. Drafting from it would point the
          # draft at the pull request's merge ref instead of main.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
