name: Release Drafter

on:
  # The draft follows a main commit only once Tests has passed on it, so the
  # draft never describes a state of main that failed its checks. Tests runs
  # on every push to main, so every main commit reaches this trigger.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Labels follow the branch name, the changed files and the body, so a pull
  # request is labeled again on a push and on an edit, which also covers a
  # new base. Any base counts: a stack opens each upper pull request on the
  # branch below it, and links it to the stack only afterwards.
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  # A pull request only gets its labels, from Release Drafter's autolabeler. A
  # Tests run on main only redrafts, with scripts/release: Release Drafter
  # finds a pull request through the commits it brought to main's history,
  # which leaves out the upper layers of a stack merged in one go, since they
  # merge into the branch below them.
  label_pull_request:
    # A run Dependabot starts gets a read-only token, so labeling would fail;
    # Dependabot labels its own pull requests as dependencies.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # A job-level permissions block replaces the workflow-level one, so the
    # read the action needs to load its configuration is repeated here.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7

  update_release_draft:
    # Only a successful Tests run of main itself redrafts: a push or a manual
    # run. The branches filter above matches the head branch's name, so a
    # pull request from a fork's own main would pass it. A failed run leaves
    # the draft at the last state of main that passed; a manual run of Tests
    # on main redrafts once it passes.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # Each run rebuilds the draft from the current state of main, so a newer
    # run replaces the one still in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      # A secret cannot appear in a step's if, so whether it is set is read
      # here once.
      RELEASE_KEY_SET: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history and the tags, to find the commits since the last
      # release. With the release deploy key when it is set, so the version
      # bump below can push to main; otherwise with GITHUB_TOKEN.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      # The draft targets the commit Tests passed on, so publishing it tags
      # exactly what was checked. With nothing to release since the last
      # release, the step sets no version and the steps below are skipped.
      - name: Draft the release
        id: draft
        env:
          TARGET: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release/main.mts draft --target "$TARGET"
      # Keep the root package version on main at the draft's, so the commit
      # the release tags carries it. The push uses the release deploy key,
      # which the main ruleset lets through (the GitHub setup creates the key
      # and adds deploy keys as a bypass actor). Unlike GITHUB_TOKEN, the push
      # starts Tests, so the bump is checked too; the redraft that follows
      # finds the version already set and pushes nothing, so this cannot loop.
      - name: Warn that the version cannot be set
        if: steps.draft.outputs.version != '' && env.RELEASE_KEY_SET != 'true'
        run: echo "::warning::RELEASE_DEPLOY_KEY is not set, so the version on main stays as it is. Run nps setup.github to create it, or nps release.sync to set the version by hand."
      - name: Set the version on main to the draft's
        if: steps.draft.outputs.version != '' && env.RELEASE_KEY_SET == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release/main.mts sync --version "$VERSION"
