name: Release Drafter

on:
  # The draft follows a main commit only once Tests has passed on it, so the
  # draft never describes a state of main that failed its checks. Tests runs
  # on every push to main, so every main commit reaches this trigger.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Labels follow the branch name, which a later push does not change, so a
  # pull request is labeled only when it is opened or reopened. Any base
  # counts: a stack opens each upper pull request on the branch below it, and
  # links it to the stack only afterwards.
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  # Release Drafter v7 splits labeling off into its own action, so each event
  # runs the one it needs: a pull request only labels, a Tests run on main
  # only redrafts. Drafting from a pull request would point the draft at its
  # merge ref instead of main.
  label_pull_request:
    if: github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # A job-level permissions block replaces the workflow-level one, so the
    # read the action needs to load its configuration is repeated here.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7

  update_release_draft:
    # Only a successful Tests run redrafts. A failed run leaves the draft at
    # the last state of main that passed; a manual run of Tests on main
    # redrafts once it passes.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    # Each run rebuilds the draft from the current state of main, so a newer
    # run replaces the one still in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
