name: Release Drafter

on:
  # The draft follows a main commit only once Tests has passed on it, so the
  # draft never describes a state of main that failed its checks. Tests runs
  # on every push to main, so every main commit reaches this trigger.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # Labels follow the branch name, the changed files and the body, so a pull
  # request is labeled again on a push and on an edit, which also covers a
  # new base. Any base counts: a stack opens each upper pull request on the
  # branch below it, and links it to the stack only afterwards.
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  # A pull request only gets its labels, from Release Drafter's autolabeler. A
  # Tests run on main only redrafts, with repo-kit: Release Drafter
  # finds a pull request through the commits it brought to main's history,
  # which leaves out the upper layers of a stack merged in one go, since they
  # merge into the branch below them.
  label_pull_request:
    # A run Dependabot starts gets a read-only token, so labeling would fail;
    # Dependabot labels its own pull requests as dependencies.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # A job-level permissions block replaces the workflow-level one, so the
    # read the action needs to load its configuration is repeated here.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7

  # repo-kit's release-draft workflow redrafts from a successful Tests run of
  # main itself, targeting the commit Tests passed on, and shares a
  # concurrency group with publishing. The version on main stays as it is
  # until the draft is published (Publish Release).
  update_release_draft:
    if: github.event_name == 'workflow_run'
    permissions:
      contents: write
      pull-requests: read
    uses: craftsamo/repo-kit/.github/workflows/release-draft.yml@v1
