name: OpenCode

# Comment `/oc [plan|build|review|debug] <instruction>` (or `/opencode`) on an
# issue or pull request. See docs/github-actions/run-ai-agent.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  # Picks the agent before any token with write access exists, so only build
  # requests get one.
  route:
    # Only people with write access can run the agent and spend the model
    # budget.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      agent: ${{ steps.route.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Route request
        id: route
        run: node scripts/ci/opencode/main.mts route

  answer:
    needs: route
    if: needs.route.outputs.agent != '' && needs.route.outputs.agent != 'build'
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode-agent.yml
    secrets: inherit

  build:
    needs: route
    if: needs.route.outputs.agent == 'build'
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # contents and pull-requests to push and open the PR, actions to start the
    # Tests workflow, which pushes made with this token do not trigger.
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode-agent.yml
    secrets: inherit
