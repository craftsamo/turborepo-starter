name: OpenCode

# Comment `/oc [plan|build|review|debug] <instruction>` (or `/opencode`) on an
# issue or pull request. See docs/github-actions/run-ai-agent.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  # repo-kit's opencode workflow routes the comment first, without a token
  # that can write, and grants each agent only what it needs of these: the
  # build agent pushes, opens pull requests and starts the Tests workflow.
  opencode:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: craftsamo/repo-kit/.github/workflows/opencode.yml@v1
    with:
      ci-workflow: tests.yml
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
